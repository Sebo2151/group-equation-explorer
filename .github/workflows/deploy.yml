# Builds the static export and publishes it to GitHub Pages.
#
# Enable this once, under Settings -> Pages -> Source -> GitHub Actions. The
# artifact deployment path does not run Jekyll, but `.nojekyll` is written all
# the same: if the site is ever served straight from a branch instead, Jekyll
# would silently drop the `_next` directory that every asset lives in, and the
# failure looks like a blank page rather than an error.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm test

      # `next build` runs TypeScript itself, and it regenerates the gitignored
      # `next-env.d.ts` that a standalone `tsc` would need, so it comes before
      # any further checking rather than after.
      - run: npm run build
      - run: touch out/.nojekyll

      # The browser suite is the one that knows whether a learner can still work
      # a proof, so it gates the deployment rather than merely reporting on it.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
